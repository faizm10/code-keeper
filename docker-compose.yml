version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: code-keeper-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - code-keeper-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code-keeper-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - code-keeper-network
    restart: unless-stopped
    volumes:
      # Mount volumes as needed for your backend
      - ./backend:/app
      - /app/node_modules

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: code-keeper-docs
    ports:
      - "8080:80"
    networks:
      - code-keeper-network
    restart: unless-stopped
    profiles:
      - docs

networks:
  code-keeper-network:
    driver: bridge

