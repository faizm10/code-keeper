version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: code-keeper-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://code-keeper.vercel.app}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - code-keeper-network
    restart: unless-stopped


  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: code-keeper-docs
    ports:
      - "8080:80"
    networks:
      - code-keeper-network
    restart: unless-stopped
    profiles:
      - docs

networks:
  code-keeper-network:
    driver: bridge

