version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ck
      POSTGRES_PASSWORD: ck
      POSTGRES_DB: ck
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  server:
    build: ./apps/server
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  worker:
    build: ./apps/worker
    env_file: .env
    depends_on: [postgres, redis]

  web:
    build: ./apps/web
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [server]
